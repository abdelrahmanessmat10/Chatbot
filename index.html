<!DOCTYPE html>
<html>

<head>
  <title>Chatbot</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">

    function ChatInput({ chatMessages, setChatMessages }) {
      const [inputText, setInputText] = React.useState('');

      function saveInputText(event) {
        setInputText(event.target.value)
      }

      function sendMessage() {
        const newChatMessages = [
          ...chatMessages, // create a copy of chatMessages array (... caleed spread operator)
          {
            message: inputText,
            sender: 'user',
            id: crypto.randomUUID() // create a unique id every time
          }
        ]
        setChatMessages(newChatMessages);

        const response = Chatbot.getResponse(inputText);
        setChatMessages([
          ...newChatMessages, // create a copy of chatMessages array (... caleed spread operator)
          {
            message: response,
            sender: 'robot',
            id: crypto.randomUUID() // create a unique id every time
          }
        ]);

        setInputText('');
      }

      return (
        <div className="chat-input-container">
          <input
            placeholder="Send a message to Chatbot"
            size="30"
            onChange={saveInputText}
            value={inputText}
            className="chat-input"
          />
          <button
            onClick={sendMessage}
            className="send-button"
          >Send</button>
        </div>
      );
    }

    function ChatMessage({ message, sender }) {

      // const message = props.message;
      //const sender = props.sender;
      //const { message, sender } = props;

      /* if (sender === 'user') {
         return (
           <div>
             {message}
             <img src="images/user.png" width="40px" />
           </div>
         );
       }*/
      return (
        // if (codition) result ---> condition&&result
        <div className={
          sender === 'user'
            ? 'chat-message-user'
            : 'chat-message-robot'
        }>
          {sender === 'robot' && (
            <img src="images/chatbot.png" className="chat-message-profile" />
          )}
          <div className="chat-message-text">
            {message}
          </div>

          {sender === 'user' && (
            <img src="images/user.png" className="chat-message-profile" />
          )}
        </div>
      );
    }

    function ChatMessages({ chatMessages }) {
      const chatMessagesRef = React.useRef(null);

      React.useEffect(() => {
        const containerElem = chatMessagesRef.current;
        if (containerElem) {
          containerElem.scrollTop = containerElem.scrollHeight;
        }
      }, [chatMessages]);

      return (
        <div
          className="chat-messages-container"
          ref={chatMessagesRef}
        >
          {chatMessages.map((chatMessage) => {
            return (
              <ChatMessage
                message={chatMessage.message}
                sender={chatMessage.sender}
                key={chatMessage.id}
              />
            );
          })}
        </div>
      )
    }


    function App() {

      const [chatMessages, setChatMessages] = React.useState([{
        message: 'Hello Chatbot',
        sender: 'user',
        id: 'id1'
      },
      {
        message: 'Hello! How can I help you?',
        sender: 'robot',
        id: 'id2'
      },
      {
        message: 'Can you get me todays date?',
        sender: 'user',
        id: 'id3'
      },
      {
        message: 'Today is september 2',
        sender: 'robot',
        id: 'id4'
      }]);

      /*  const chatMessages = array[0]; //array of 0 gives the current data
        const setChatMessages = array[1]; //array of 1 return a function that updates the data
        */


      return (
        <div className="app-container">
          <ChatMessages
            chatMessages={chatMessages}
          />
          <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
          />
        </div>
      );
    }


    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>

</html>
